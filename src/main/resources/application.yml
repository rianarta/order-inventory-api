server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-inventory-system
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000
  
  # Cache Configuration
  cache:
    type: ${CACHE_TYPE:simple}  # Use 'redis' for production with Docker, 'simple' for local dev

# Logging Configuration
logging:
  level:
    com.portfolio.order: DEBUG
    org.springframework.cache: DEBUG
