server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-inventory-system
  
  # ===================================
  # PostgreSQL Configuration (Environment Variables)
  # ===================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_inventory}?sslmode=${DB_SSL_MODE:disable}&channel_binding=${DB_CHANNEL_BINDING:prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Redis Configuration (Optional - for caching)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000
  
  # Cache Configuration
  cache:
    type: ${CACHE_TYPE:simple}  # Use 'redis' for production, 'simple' for local dev

# Logging Configuration
logging:
  level:
    com.portfolio.order: DEBUG
    org.springframework.cache: DEBUG

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH_CHECK:false} # Set true jika Redis sudah pasti menyala
    db:
      enabled: true
