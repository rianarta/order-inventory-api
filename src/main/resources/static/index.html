<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order & Inventory System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Order & Inventory System</h1>
            <p class="subtitle">Manage your products efficiently</p>
        </header>

        <main>
            <!-- Add Product Form -->
            <section class="form-section">
                <h2>Add New Product</h2>
                <form id="productForm" class="product-form">
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter product name" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price (IDR)</label>
                        <input type="number" id="price" name="price" placeholder="Enter price" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" placeholder="Enter stock quantity" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Product</button>
                </form>
            </section>

            <!-- Product Catalog -->
            <section class="catalog-section">
                <div class="catalog-header">
                    <h2>Product Catalog</h2>
                    <button id="refreshBtn" class="btn btn-secondary">🔄 Refresh</button>
                </div>
                
                <div id="loadingSpinner" class="spinner hidden"></div>
                
                <div id="errorMessage" class="error-message hidden"></div>
                
                <table id="productTable" class="product-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- Products will be dynamically loaded here -->
                    </tbody>
                </table>
                
                <div id="emptyState" class="empty-state hidden">
                    <p>📭 No products found. Add your first product above!</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Built with Spring Boot 3 + Redis + PostgreSQL</p>
        </footer>
    </div>

    <!-- Confirmation Modal -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete this product?</p>
            <div class="modal-actions">
                <button id="confirmDelete" class="btn btn-danger">Delete</button>
                <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
