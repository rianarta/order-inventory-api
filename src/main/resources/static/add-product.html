<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk - Order Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-content">
            <span class="topbar-text">📦 Order Inventory System</span>
            <span class="topbar-contact">📞 Hubungi Kami</span>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <a href="dashboard.html" class="logo">
                <span class="logo-icon">🛒</span>
                <div class="logo-text">
                    <h1>ORDER</h1>
                    <span>INVENTORY</span>
                </div>
            </a>
            
            <div class="header-actions">
                <a href="dashboard.html" class="btn-add-product">
                    <span>←</span>
                    <span>Kembali</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="add-product-main">
        <div class="add-product-container">
            <div class="add-product-header">
                <h2>➕ Tambah Produk Baru</h2>
                <p>Isi form di bawah untuk menambahkan produk ke inventory</p>
            </div>

            <form id="addProductForm" class="add-product-form">
                <div class="form-section">
                    <h3>Informasi Produk</h3>
                    
                    <div class="form-group">
                        <label for="name">Nama Produk *</label>
                        <input type="text" id="name" placeholder="Contoh: Kopi Sachet ABC" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Harga (IDR) *</label>
                            <input type="number" id="price" placeholder="15000" step="100" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="stock">Stok *</label>
                            <input type="number" id="stock" placeholder="0" min="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category">
                            <option value="all">Semua</option>
                            <option value="minuman">🥤 Minuman</option>
                            <option value="makanan">🍔 Makanan</option>
                            <option value="snack">🍿 Snack</option>
                            <option value="sarapan">🥣 Sarapan</option>
                            <option value="mie">🍜 Mie</option>
                            <option value="bumbu">🧂 Bumbu</option>
                            <option value="perawatan">🧴 Perawatan</option>
                            <option value="lainnya">📦 Lainnya</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Deskripsi</label>
                        <textarea id="description" rows="3" placeholder="Deskripsi produk (opsional)"></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Gambar Produk</h3>
                    
                    <div class="image-upload-area" id="imageUploadArea">
                        <div class="upload-placeholder">
                            <span class="upload-icon">📷</span>
                            <p>Klik atau drag gambar ke sini</p>
                            <p class="upload-hint">Format: JPG, PNG, GIF (Maks 5MB)</p>
                        </div>
                        <input type="file" id="productImage" accept="image/*" hidden>
                    </div>
                    
                    <div id="imagePreviewContainer" class="image-preview-container hidden">
                        <div class="preview-wrapper">
                            <img id="previewImg" src="" alt="Preview">
                            <button type="button" id="removeImage" class="remove-img-btn-large">×</button>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save-product">
                        💾 Simpan Produk
                    </button>
                    <button type="reset" class="btn-reset">🔄 Reset</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage"></span>
    </div>

    <script src="app.js"></script>
    <script>
        // Initialize add product page
        document.addEventListener('DOMContentLoaded', () => {
            initAddProduct();
        });
        
        function initAddProduct() {
            const form = document.getElementById('addProductForm');
            const imageUploadArea = document.getElementById('imageUploadArea');
            const imageFile = document.getElementById('productImage');
            const removeImageBtn = document.getElementById('removeImage');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('previewImg');
            
            let selectedImage = null;
            
            // Image upload click
            if (imageUploadArea) {
                imageUploadArea.addEventListener('click', () => imageFile.click());
                
                imageUploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    imageUploadArea.classList.add('drag-over');
                });
                
                imageUploadArea.addEventListener('dragleave', () => {
                    imageUploadArea.classList.remove('drag-over');
                });
                
                imageUploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    imageUploadArea.classList.remove('drag-over');
                    if (e.dataTransfer.files.length > 0) {
                        handleImageSelect(e.dataTransfer.files[0]);
                    }
                });
            }
            
            // File input change
            if (imageFile) {
                imageFile.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        handleImageSelect(e.target.files[0]);
                    }
                });
            }
            
            // Remove image
            if (removeImageBtn) {
                removeImageBtn.addEventListener('click', () => {
                    selectedImage = null;
                    imageFile.value = '';
                    previewContainer.classList.add('hidden');
                    imageUploadArea.style.display = '';
                });
            }
            
            function handleImageSelect(file) {
                if (!file.type.startsWith('image/')) {
                    showToast('Pilih file gambar yang valid', 'error');
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    showToast('Ukuran gambar maksimal 5MB', 'error');
                    return;
                }
                
                selectedImage = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                    imageUploadArea.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
            
            // Form submit
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const formData = {
                        name: document.getElementById('name').value.trim(),
                        price: parseFloat(document.getElementById('price').value),
                        stock: parseInt(document.getElementById('stock').value, 10),
                        category: document.getElementById('category').value,
                        description: document.getElementById('description').value.trim()
                    };
                    
                    if (!formData.name || isNaN(formData.price) || isNaN(formData.stock)) {
                        showToast('Lengkapi semua field yang wajib', 'error');
                        return;
                    }
                    
                    try {
                        const response = await fetch(API_BASE_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(formData)
                        });
                        
                        if (!response.ok) throw new Error('Failed to create product');
                        
                        const savedProduct = await response.json();
                        
                        // Upload image if selected
                        if (selectedImage) {
                            const formDataImg = new FormData();
                            formDataImg.append('file', selectedImage);
                            
                            await fetch(`${API_BASE_URL}/${savedProduct.id}/image`, {
                                method: 'POST',
                                body: formDataImg
                            });
                        }
                        
                        showToast('Produk berhasil ditambahkan!', 'success');
                        form.reset();
                        selectedImage = null;
                        previewContainer.classList.add('hidden');
                        imageUploadArea.style.display = '';
                        
                        // Redirect after delay
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                        
                    } catch (error) {
                        console.error('Error creating product:', error);
                        showToast('Gagal menambahkan produk', 'error');
                    }
                });
            }
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            if (!toast || !toastMessage) return;
            
            toastMessage.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
    <style>
        .add-product-main {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 16px;
        }
        
        .add-product-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .add-product-header {
            background: linear-gradient(135deg, var(--primary) 0%, #E53E3E 100%);
            color: white;
            padding: 24px;
        }
        
        .add-product-header h2 {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .add-product-header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .add-product-form {
            padding: 24px;
        }
        
        .form-section {
            margin-bottom: 32px;
        }
        
        .form-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }
        
        .add-product-form .form-group {
            margin-bottom: 16px;
        }
        
        .add-product-form .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 6px;
        }
        
        .add-product-form .form-group input,
        .add-product-form .form-group textarea,
        .add-product-form .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        .add-product-form .form-group input:focus,
        .add-product-form .form-group textarea:focus,
        .add-product-form .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .add-product-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        @media (max-width: 640px) {
            .add-product-form .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .image-upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .image-upload-area:hover {
            border-color: var(--primary);
            background: rgba(220, 38, 38, 0.05);
        }
        
        .image-upload-area.drag-over {
            border-color: var(--primary);
            background: rgba(220, 38, 38, 0.1);
        }
        
        .upload-placeholder .upload-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        
        .upload-placeholder p {
            color: var(--gray);
            margin-bottom: 4px;
        }
        
        .upload-hint {
            font-size: 12px !important;
            color: #9CA3AF !important;
        }
        
        .image-preview-container {
            margin-top: 16px;
        }
        
        .preview-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .preview-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .remove-img-btn-large {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .btn-save-product {
            flex: 1;
            padding: 14px 24px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-save-product:hover {
            background-color: #15803D;
        }
        
        .btn-reset {
            padding: 14px 24px;
            background-color: var(--light-gray);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-reset:hover {
            background-color: var(--border);
        }
    </style>
</body>
</html>
