<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Order & Inventory System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1>📦 Order & Inventory</h1>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="add-product.html" class="nav-link active">➕ Add Product</a>
        </div>
    </nav>

    <div class="container">
        <!-- Page Header -->
        <header class="page-header">
            <div>
                <h1>➕ Add New Product</h1>
                <p class="subtitle">Fill in the details to add a new product</p>
            </div>
            <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
        </header>

        <!-- Add Product Form -->
        <section class="form-section">
            <form id="addProductForm" class="product-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Product Name *</label>
                        <input type="text" id="name" name="name" placeholder="Enter product name" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price (IDR) *</label>
                        <input type="number" id="price" name="price" placeholder="Enter price" step="0.01" min="0" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="stock">Stock Quantity *</label>
                        <input type="number" id="stock" name="stock" placeholder="Enter stock quantity" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" placeholder="Enter product description"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>Product Image</label>
                    <div class="image-upload-area" id="imageUploadArea">
                        <div class="upload-placeholder">
                            <span class="upload-icon">📷</span>
                            <p>Click or drag image here</p>
                            <p class="upload-hint">PNG, JPG, GIF up to 5MB</p>
                        </div>
                        <input type="file" id="productImage" accept="image/*" hidden>
                    </div>
                    <div class="image-preview" id="imagePreview" style="display: none;">
                        <img id="previewImg" src="" alt="Preview">
                        <button type="button" id="removeImage" class="btn-remove">×</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">➕ Add Product</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script src="app.js"></script>
    <script>
        // Add Product specific initialization
        document.addEventListener('DOMContentLoaded', () => {
            initAddProduct();
        });
    </script>
</body>
</html>
